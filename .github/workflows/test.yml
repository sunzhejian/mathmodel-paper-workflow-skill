name: Test reusable workflow tools
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pinned Typst compiler (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $mcmTypstZip = Join-Path $env:RUNNER_TEMP 'mcm-typst.zip'
          $mcmTypstRoot = Join-Path $env:RUNNER_TEMP 'mcm-typst-runtime'
          Invoke-WebRequest -Uri 'https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-pc-windows-msvc.zip' -OutFile $mcmTypstZip
          if ((Get-FileHash -LiteralPath $mcmTypstZip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '19ce3551153c2fe7ee9fa2f95208310c8f4d3209fedb699e0333faf8913f6736') { throw 'Typst checksum mismatch' }
          Expand-Archive -LiteralPath $mcmTypstZip -DestinationPath $mcmTypstRoot
          $mcmTypstExe = Join-Path $mcmTypstRoot 'typst-x86_64-pc-windows-msvc/typst.exe'
          "MATHMODEL_TYPST_EXE=$mcmTypstExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Pinned Typst compiler (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl --fail --location --silent --show-error 'https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz' -o "$RUNNER_TEMP/mcm-typst.tar.xz"
          printf 'a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c  %s\n' "$RUNNER_TEMP/mcm-typst.tar.xz" | sha256sum --check
          mkdir "$RUNNER_TEMP/mcm-typst-runtime"
          tar -xJf "$RUNNER_TEMP/mcm-typst.tar.xz" -C "$RUNNER_TEMP/mcm-typst-runtime"
          printf 'MATHMODEL_TYPST_EXE=%s\n' "$RUNNER_TEMP/mcm-typst-runtime/typst-x86_64-unknown-linux-musl/typst" >> "$GITHUB_ENV"
      - run: python -m pip install -r requirements.txt -r requirements-figures.txt
      - name: Pinned Chinese font for Big Data template checks
        shell: bash
        run: |
          python scripts/fetch_cjk_test_font.py --output "$RUNNER_TEMP/mathmodel-cjk-fonts"
          printf 'MATHMODEL_CJK_FONT_DIR=%s\n' "$RUNNER_TEMP/mathmodel-cjk-fonts" >> "$GITHUB_ENV"
      - run: python scripts/check_vendor_skills.py --check-index
      - run: python -m unittest discover -s tests -v
